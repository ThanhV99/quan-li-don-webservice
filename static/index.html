<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lí đơn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
/* màu nhấn = tím mực dấu mộc; 5 màu trạng thái giữ riêng (vàng Đã đặt, xanh ngọc Đã nhận, xanh Thanh toán, lục Hoàn thành, đỏ Hủy) */
:root {
  --bg: #eceee9; --card: #fff; --text: #1a1f2b; --muted: #656c7a; --line: #dcdfd8;
  --accent: #5b3cc4; --accent-soft: #ece7fa; --on-accent: #fff; --ok: #1e8e4e; --ok-soft: #e1f3e8;
  --warn: #b26a00; --warn-soft: #fbf0d9; --bad: #c8323f; --bad-soft: #fbe5e7;
  --blue: #1f6fd1; --blue-soft: #e2eefc; --shadow: 0 1px 0 rgba(26,31,43,.04); --gray-card: #e2e4df;
  --teal: #0b7f7a; --teal-soft: #dcf1ef;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171c; --card: #1f2229; --text: #e9eaee; --muted: #959baa; --line: #31353f;
    --accent: #a993f5; --accent-soft: #2b2442; --on-accent: #17122b; --ok: #4fc78a; --ok-soft: #1a3227;
    --warn: #f0b44a; --warn-soft: #382c16; --bad: #f2707f; --bad-soft: #3b1f25;
    --blue: #6ea8ff; --blue-soft: #1c2a42; --shadow: none; --gray-card: #2b2e35;
    --teal: #4cc9bf; --teal-soft: #163330;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.kpi .value, .money-row b, .st-tile b, td.r, .pickbar .nums b, .order .id { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

header { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--card) 86%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); }
.bar { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { font-weight: 800; font-size: 15px; white-space: nowrap; color: var(--accent); display: inline-flex; align-items: center; gap: 6px;
  border: 2px solid currentColor; outline: 1px solid currentColor; outline-offset: 2px; border-radius: 6px; padding: 1px 8px;
  transform: rotate(-3deg); margin: 0 4px; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
nav::-webkit-scrollbar { display: none; }
/* tab cuối bị cắt khi hết chỗ → mờ dần ở mép phải thay vì cắt ngang chữ */
nav { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); padding-right: 24px; }
nav a { border: 0; background: none; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  color: var(--muted); white-space: nowrap; font-weight: 500; text-decoration: none; }
nav a:hover { color: var(--text); background: var(--bg); }
nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 80px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.toolbar .grow { flex: 1; min-width: 160px; }
.date-range { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.date-box { position: relative; display: inline-flex; align-items: center; gap: 4px; }
.date-box .input { width: 112px; padding: 6px 8px; text-align: center; }
.date-box .picker { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.input, select.input, textarea.input { width: 100%; padding: 9px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--card); outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 90px; resize: vertical; }
.phone-sug { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
tr.sku-on td { background: var(--ok-soft); font-weight: 600; }
.chip-btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 4px 9px;
  font-size: 13px; cursor: pointer; text-align: left; }
.chip-btn:hover { border-color: var(--accent); }
.chip-btn.on { border-color: var(--accent); background: var(--accent-soft); }
/* sửa địa chỉ: ô nhập to, modal rộng hơn (địa chỉ dài nhiều dòng) */
.modal:has(.addr-form) { max-width: 820px; }
.addr-form textarea.input { min-height: 60vh; line-height: 1.5; }
.addr-card { display: flex; flex-direction: column; gap: 10px; }
.addr-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
.addr-card .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.addr-card .actions .muted { margin-right: auto; font-size: 12px; }
.input::placeholder { color: var(--muted); opacity: .55; font-style: italic; }
.input[readonly] { background: var(--bg); border-style: dashed; font-weight: 700; cursor: default; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 10px;
  cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled:not(.busy) { opacity: .55; cursor: not-allowed; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.bad { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; overflow-x: auto; }
.seg button { border: 0; background: none; padding: 6px 11px; border-radius: 8px; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.seg .n { opacity: .75; font-size: 12px; margin-left: 3px; }

.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.cards { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.card h3 { margin: 0 0 10px; font-size: 15px; }
.kpi .label { color: var(--muted); font-size: 13px; }
.kpi .value { font-size: 28px; font-weight: 800; margin-top: 2px; letter-spacing: -.6px; line-height: 1.2; }
.kpi .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.split { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 4px; }
.split-row { display: grid; grid-template-columns: 1fr auto 38px; gap: 8px; align-items: baseline; font-size: 13px; }
.split-row .muted { text-align: right; font-size: 12px; }
.split-row i { grid-column: 1 / -1; height: 5px; border-radius: 99px; margin-top: -4px; }
.split-row.click { cursor: pointer; }
@media (max-width: 640px) { .kpi.wide { grid-column: 1 / -1; } }
.st-bar { display: flex; gap: 2px; height: 8px; border-radius: 99px; overflow: hidden; margin: 10px 0 8px; }
.st-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.st-tile { border-radius: 10px; padding: 6px 10px; cursor: pointer; display: flex; justify-content: space-between;
  align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st-tile b { font-size: 18px; }
.st-tile.zero { opacity: .45; }
/* công thức: kẻ đứt như dòng cộng trên hóa đơn */
.formula { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted);
  font-size: 12px; line-height: 1.6; }
.formula b { color: var(--text); font-weight: 600; }
.muted { color: var(--muted); font-size: 13px; }
.san { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.san-head { display: grid; grid-template-columns: 92px 1fr auto; align-items: center; gap: 10px; }
.san-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--bg); gap: 2px; }
.san-bar i { display: block; }
.san-bar .ok { background: var(--ok); } .san-bar .wait { background: var(--warn); } .san-bar .fail { background: var(--bad); }
.san-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; padding-left: 102px; }
.san-tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.san-tag img { width: 18px; height: 18px; flex: none; }
/* logo đơn vị vận chuyển: nhãn nền trắng để logo chữ đen (Viettel Post) vẫn đọc được ở chế độ tối */
.vc-logo { display: inline-flex; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 5px;
  padding: 2px 5px; vertical-align: middle; }
.vc-logo img { height: 14px; width: auto; display: block; }
.chip { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.wait { background: var(--warn-soft); color: var(--warn); }
.chip.fail { background: var(--bad-soft); color: var(--bad); }
.phone-san { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.phone-san > div { display: flex; align-items: center; gap: 6px; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
.section-title { margin: 28px 0 10px; font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
.section-title small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
/* tên tháng = tiêu đề trang Tổng quan, bấm để đổi tháng */
.month-pick { appearance: none; -webkit-appearance: none; border: 0; background: none; cursor: pointer; padding: 0 22px 0 0;
  font-size: 26px; font-weight: 800; letter-spacing: -.6px; color: var(--text);
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(-45deg, transparent 50%, var(--muted) 50%);
  background-size: 6px 6px; background-position: right 8px center, right 2px center; background-repeat: no-repeat; }
.month-pick option { font-size: 15px; font-weight: 400; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-ordered { background: var(--warn-soft); color: var(--warn); }
.b-received { background: var(--teal-soft); color: var(--teal); }
.b-paid { background: var(--blue-soft); color: var(--blue); }
.b-done { background: var(--ok-soft); color: var(--ok); }
.b-cancel { background: var(--bad-soft); color: var(--bad); }
.b-muted { background: var(--bg); color: var(--muted); }
.b-accent { background: var(--accent-soft); color: var(--accent); }

/* thẻ đơn = phiếu gửi hàng: dấu mộc trạng thái + đường xé răng cưa trước phần tiền */
.order { cursor: pointer; transition: border-color .1s; display: flex; flex-direction: column; gap: 8px; }
.order:hover { border-color: var(--accent); }
.order .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.order .id { font-weight: 700; color: var(--muted); }
.order .id b { color: var(--text); }
.moc { display: inline; }
.moc span { white-space: nowrap; }
.moc .sep { font-style: normal; margin-left: 5px; opacity: .6; }
.order .top .pick { align-items: flex-start; flex: 1; min-width: 0; }
.order .top .id { min-width: 0; }
.order .top .stamp { flex-shrink: 0; align-self: flex-start; }
.stamp { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; font-size: 12px; font-weight: 800;
  border: 2px solid currentColor; border-radius: 5px; outline: 1px solid currentColor; outline-offset: 2px;
  transform: rotate(-5deg); margin: 4px 4px 0 0; white-space: nowrap; background: none !important; opacity: .92; }
.tear { position: relative; border-top: 2px dashed var(--line); margin: 4px -15px; }
.tear::before, .tear::after { content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--line); }
.tear::before { left: -9px; clip-path: inset(0 0 0 50%); }
.tear::after { right: -9px; clip-path: inset(0 50% 0 0); }
.order .money-row { background: none; padding: 0; }
.order .money-row .lai b { font-size: 16px; font-weight: 800; }
.track { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.track code { font: 600 13px/1 system-ui, sans-serif; letter-spacing: .4px; color: var(--text); }
.vc-code { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.vc-code:hover { color: var(--accent); }
.order .pick { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.order .pick input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
/* đơn Đã đặt: sọc trái theo vận chuyển — xanh lá đậm + nền = sắp giao, xanh dương = có mã, cam nét đứt = chưa có mã */
.order.ship-near { box-shadow: inset 5px 0 0 var(--ok); background: var(--ok-soft); border-color: var(--ok); }
.order.ship-giao { box-shadow: inset 8px 0 0 var(--ok); border-width: 2px; }
/* 🏍 đang giao (nhân viên đã đi giao): "lửa cháy" — viền gradient lửa chạy quanh thẻ, quầng cam bập bùng,
   hàng ngọn lửa nhỏ nhảy trên mép trên thẻ */
.order.ship-giao { position: relative; border: 2px solid transparent;
  background: linear-gradient(var(--ok-soft), var(--ok-soft)) padding-box,
              linear-gradient(90deg, #ff3d00, #ff9100, #ffd600, #ff9100, #ff3d00, #ff9100, #ffd600) border-box;
  background-size: 100% 100%, 300% 100%;
  animation: fire-border 2.4s linear infinite, fire-glow .9s ease-in-out infinite alternate; }
.order.ship-giao::before { content: ""; position: absolute; left: 14px; right: 14px; top: -19px; height: 20px; pointer-events: none;
  background: radial-gradient(ellipse 8px 19px at 50% 100%, #fff3b0 0, #ffd600 25%, #ff9100 50%, #ff3d00 70%, transparent 72%) 0 100% / 18px 20px repeat-x,
              radial-gradient(ellipse 5px 12px at 50% 100%, #ffd600 0, #ff6d00 55%, transparent 60%) 9px 100% / 18px 13px repeat-x;
  transform-origin: 50% 100%; animation: fire-flicker .45s ease-in-out infinite alternate; }
@keyframes fire-border { to { background-position: 0 0, 300% 0; } }
@keyframes fire-glow {
  from { box-shadow: inset 8px 0 0 #ff6d00, 0 0 6px 1px rgba(255, 98, 0, .35); }
  to { box-shadow: inset 8px 0 0 #ff9100, 0 0 18px 4px rgba(255, 140, 0, .55), 0 -6px 16px rgba(255, 61, 0, .35); }
}
@keyframes fire-flicker {
  0% { transform: scaleY(.75) skewX(-3deg); opacity: .85; }
  50% { transform: scaleY(1.05) skewX(2deg); opacity: 1; }
  100% { transform: scaleY(.9) skewX(4deg) translateX(2px); opacity: .9; }
}
.badge.near.fire { background: linear-gradient(90deg, #ff3d00, #ff9100); color: #fff; }
@media (prefers-reduced-motion: reduce) { .order.ship-giao, .order.ship-giao::before { animation: none; } }
.order.ship-has { box-shadow: inset 5px 0 0 var(--blue); }
.order.ship-none { box-shadow: inset 5px 0 0 var(--warn); background: var(--gray-card); }
/* hãng báo đã giao mà đơn còn Đã đặt: viền xanh ngọc (màu Đã nhận) + vòng sáng lan ra theo nhịp để nhớ bấm 📦 Đã nhận */
.order.ship-arrived { border: 2px solid var(--teal); background: var(--teal-soft); box-shadow: inset 8px 0 0 var(--teal);
  animation: arrived-ring 2.2s ease-out infinite; }
@keyframes arrived-ring {
  0% { box-shadow: inset 8px 0 0 var(--teal), 0 0 0 0 color-mix(in srgb, var(--teal) 60%, transparent); }
  70%, 100% { box-shadow: inset 8px 0 0 var(--teal), 0 0 0 12px color-mix(in srgb, var(--teal) 0%, transparent); }
}
.order .arrived-note { font-size: 13px; font-weight: 700; color: var(--teal); }
@media (prefers-reduced-motion: reduce) { .order.ship-arrived { animation: none; } }
/* các mốc đổi trạng thái trong chi tiết đơn: chấm màu trạng thái nối bằng đường dọc */
.st-timeline { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
.st-timeline li { position: relative; padding: 0 0 10px 22px; }
.st-timeline li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
.st-timeline li:not(:last-child)::after { content: ""; position: absolute; left: 8px; top: 17px; bottom: 0; width: 2px; background: var(--line); }
.st-timeline .muted { font-size: 12px; }
.ship-legend { display: inline-flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.ship-legend .lg { padding: 3px 8px 3px 10px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); }
.ship-legend .near { box-shadow: inset 4px 0 0 var(--ok); background: var(--ok-soft); }
.ship-legend .giao { box-shadow: inset 7px 0 0 var(--ok); border: 2px solid var(--ok); }
.ship-legend .has { box-shadow: inset 4px 0 0 var(--blue); }
.ship-legend .arrived { box-shadow: inset 7px 0 0 var(--teal); border: 2px solid var(--teal); background: var(--teal-soft); }
.ship-legend .none { box-shadow: inset 4px 0 0 var(--warn); background: var(--gray-card); }
.order .courier { font-size: 13px; padding: 5px 9px; border-radius: 8px; background: var(--ok-soft); color: var(--text); }
.order .courier a { color: var(--ok); font-weight: 700; }
.order .no-vc { font-size: 13px; font-weight: 700; color: var(--warn); }
.badge.near { background: var(--ok); color: var(--card); font-weight: 800; }
.order.picked { outline: 2px solid var(--accent); background: var(--accent-soft); }
#pickbar:not(:empty) { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card);
  border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.08); padding: 10px 16px; }
body:has(#pickbar:not(:empty)) .fab { display: none; }
body:has(#pickbar:not(:empty)) main { padding-bottom: 220px; }
.pickbar { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.pickbar .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pickbar .nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px 14px; font-size: 12px; color: var(--muted); }
.pickbar .nums b { display: block; font-size: 15px; color: var(--text); }
.order .title { font-weight: 600; font-size: 16px; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.money-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--bg); border-radius: 10px; padding: 8px; }
.money-row div { font-size: 12px; color: var(--muted); }
.money-row b { display: block; font-size: 14px; color: var(--text); }

.status-pills { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.pill { cursor: pointer; text-align: left; }
.pill .value { font-size: 22px; }
.chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 8px; }
.chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.chart .barv { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
.chart .d { font-size: 10px; color: var(--muted); margin-top: 3px; }
.card:has(> table) { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--bg); }

.product { padding: 0; overflow: hidden; }
.product .head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.product .head b { font-size: 16px; }
.pimgs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px 0; }
.pimgs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
.pimgs .meta { flex-basis: 100%; }
.shop { padding: 12px 14px; border-bottom: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
.shop:last-child { border-bottom: 0; }
.shop.off { opacity: .55; }
.shop .line1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* đang tải: vạch mực chạy trên cùng (mọi lệnh gọi máy chủ), nút đang chờ hiện vòng quay, tab mới hiện khung xám */

/* chuyển tab: phủ cả trang (chặn bấm liên tục) – thùng hàng nảy + bóng + chữ "Đang tải …"; chặn bấm ngay, hiện hình sau 120 ms */
#pageload { position: fixed; inset: 0; z-index: 1050; display: none; place-items: center; cursor: progress;
  background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(3px) saturate(.9);
  -webkit-backdrop-filter: blur(3px) saturate(.9); opacity: 0; transition: opacity .18s ease; }

.pl-stage { position: relative; width: 74px; height: 70px; }

  background: linear-gradient(180deg, #d9a35f, #c2853f); box-shadow: inset 0 -5px 0 rgba(0,0,0,.12);
  animation: pl-bounce .9s cubic-bezier(.45,0,.55,1) infinite; transform-origin: 50% 100%; }
.pl-box::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; margin-left: -5px;
  background: color-mix(in srgb, var(--accent) 75%, #fff); opacity: .9; }
.pl-box::after { content: ""; position: absolute; left: -3px; right: -3px; top: -6px; height: 10px; border-radius: 4px;
  background: linear-gradient(180deg, #e6b574, #d39a55); box-shadow: 0 1px 0 rgba(0,0,0,.08); }
.pl-shadow { position: absolute; left: 50%; bottom: 2px; width: 50px; height: 8px; margin-left: -25px; border-radius: 50%;
  background: rgba(10,12,20,.22); animation: pl-shadow .9s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes pl-bounce {
  0%, 100% { transform: translateY(16px) scale(1.08, .9); }
  15% { transform: translateY(10px) scale(.96, 1.05); }
  50% { transform: translateY(-6px) rotate(-6deg); }
  85% { transform: translateY(12px) scale(1, 1); } }
@keyframes pl-shadow { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.55); opacity: .4; } }
.pl-text { font-weight: 600; font-size: 15px; display: flex; align-items: baseline; gap: 2px; }

@keyframes pl-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }
.pl-track { width: 150px; height: 4px; border-radius: 99px; overflow: hidden; position: relative;
  background: color-mix(in srgb, var(--line) 70%, var(--card)); }

}

<script>
// ---------- tiện ích ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const jsq = s => esc(JSON.stringify(String(s ?? "")));  // chuỗi an toàn trong onclick="…"
const money = n => (Math.round(n || 0)).toLocaleString("vi-VN");  // không ghi đơn vị (đ, k): 4.300.000
function short(n) {  // giống utils.money_short: 4300000 → 4tr3, 200000 → 200
  n = Math.round(n || 0);
  if (n < 0) return "-" + short(-n);
  if (n >= 1e6 && n % 1000 === 0) {
    const tr = Math.floor(n / 1e6), rest = n % 1e6;
    if (!rest) return tr + "tr";
    return rest % 1e5 === 0 ? `${tr}tr${rest / 1e5}` : `${tr}tr${String(rest / 1000).padStart(3, "0")}`;
  }
  if (n >= 1000 && n % 1000 === 0) return String(n / 1000);
  return money(n);
}

// opts.quiet = không tự hiện toast lỗi (nơi gọi tự báo, vd form đăng nhập)
async function api(path, opts = {}) {
  const init = {method: opts.method || "GET", headers: {}};
  if (opts.body !== undefined) { init.body = JSON.stringify(opts.body); init.headers["Content-Type"] = "application/json"; }
  const unbusy = init.method === "GET" ? () => {} : busyButton();
  loading(1);
  try {
    let res;
    try { res = await fetch("/api" + path, init); }
    catch {
      const m = "Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.";
      if (!opts.quiet) toast(m, true);
      throw new Error(m);
    }
    checkVersion(res.headers.get("X-App-Version"));
    if (res.status === 401 && !["/login", "/me/password"].includes(path)) {
      if (state.me) toast("Phiên đăng nhập đã hết, mời đăng nhập lại", true);
      showLogin(); throw new Error("Chưa đăng nhập");

      const m = typeof data.detail === "string" ? data.detail
        : res.status >= 500 ? `Máy chủ lỗi (${res.status}). Thử lại sau ít phút.` : "Lỗi " + res.status;

  } finally { loading(-1); unbusy(); }
}

// các phần của 1 tổng: [nhãn, số tiền, màu, onclick?] → dòng nhãn · tiền · % kèm thanh tỉ lệ
function splitRows(parts, total) {
  return `<div class="split">${parts.map(([label, v, color, click]) => `
    <div class="split-row${click ? " click" : ""}" ${click ? `onclick="${click}"` : ""}>
      <span>${label}</span><b>${short(v)}</b><span class="muted">${total ? Math.round(v / total * 100) : 0}%</span>
      <i style="width:${total ? v / total * 100 : 0}%;background:var(--${color})"></i></div>`).join("")}</div>`;
}

// lọc theo ngày tạo đơn: state.tu / state.den = "YYYY-MM-DD" (rỗng = không giới hạn)
const DATE_PRESETS = [["all", "Mọi lúc"], ["today", "Hôm nay"], ["7d", "7 ngày"], ["14d", "14 ngày"], ["21d", "21 ngày"], ["month", "Tháng này"], ["prev", "Tháng trước"]];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function presetRange(k) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const lastDays = n => [ymd(new Date(y, m, now.getDate() - n + 1)), ymd(now)];  // n ngày tính cả hôm nay
  return {all: ["", ""], today: [ymd(now), ymd(now)], "7d": lastDays(7), "14d": lastDays(14), "21d": lastDays(21),
          month: [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))],
          prev: [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))]}[k];
}
const datePreset = () => DATE_PRESETS.map(([k]) => k).find(k => presetRange(k).join() === [state.tu || "", state.den || ""].join());
// ô ngày dd/mm/yyyy (gõ tay: 5/10, 05/10/26, 5-10-2026, liền số 0510 / 051026 / 05102026…) + nút 📅 mở lịch của trình duyệt
const dmy = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";
function parseDmy(text) {
  if (!text.trim()) return "";
  const m = text.trim().match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/)
    || text.trim().match(/^(\d{2})(\d{2})(\d{2}|\d{4})?$/);  // liền số: ddmm, ddmmyy, ddmmyyyy
  if (!m) return null;
  const y = !m[3] ? new Date().getFullYear() : m[3].length === 2 ? 2000 + +m[3] : +m[3];
  const d = new Date(y, m[2] - 1, m[1]);
  return d.getDate() === +m[1] && d.getMonth() === m[2] - 1 ? ymd(d) : null;
}
function dateBox(key, label) {
  const set = key === "tu" ? "setDates(null,v,null)" : "setDates(null,null,v)";
  return `<span class="date-box"><input class="input" inputmode="numeric" placeholder="dd/mm/yyyy" title="${label}" value="${dmy(state[key])}"
      onchange="const v=parseDmy(this.value);if(v===null){toast('Ngày không đúng, gõ dạng dd/mm/yyyy hoặc liền số 03112026',true);this.value=dmy(state.${key})}else{${set}}">
    <button class="btn sm" title="Chọn trên lịch" onclick="const p=this.nextElementSibling;try{p.showPicker()}catch{p.click()}">📅</button>
    <input type="date" class="picker" tabindex="-1" value="${state[key] || ""}" onchange="const v=this.value;${set}"></span>`;
}
function setDates(preset, tu, den) {
  let [a, b] = preset ? presetRange(preset) : [tu ?? state.tu ?? "", den ?? state.den ?? ""];
  if (a && b && a > b) [a, b] = [b, a];
  go("orders", {tu: a, den: b});
}
async function loadOrders() {
  const qs = new URLSearchParams();
  if (state.status) qs.set("status", state.status);
  if (state.q) qs.set("q", state.q);
  if (state.tu) qs.set("tu", state.tu);
  if (state.den) qs.set("den", state.den);
  if (state.cd) qs.set("cd", state.cd);
  if (state.vc) qs.set("vc", state.vc);
  if (state.san) qs.set("san", state.san);
  if (state.ngay) qs.set("ngay", state.ngay);
  if (state.dc) qs.set("dc", state.dc);
  const {orders: list, counts, total, people, products, carriers, sans, cds, addresses, no_paid_mark, status_log_since} = await api("/orders?" + qs);
  renderCdSeg(cds);
  renderSanSeg(sans);
  renderVcSeg(carriers);
  renderByPerson(people);
  loadBonus();  // số đơn đạt thay đổi khi đơn đổi trạng thái
  renderByProduct(products);
  renderByAddr(addresses || []);
  const sts = ["Đã đặt", "Đã nhận", "Thanh toán", "Hoàn thành", "Đã hủy", "all"];
  $("#status-seg").innerHTML = sts.map(st => `<button class="${state.status === st ? "on" : ""}" onclick="go('orders',{status:'${st}'})">
    ${st === "all" ? "Tất cả" : (STATUS[st][0] + " " + st)}${st !== "all" ? `<span class="n">${counts[st]}</span>` : ""}</button>`).join("");
  $("#orders-total").innerHTML = `${total} đơn` + (state.ngay === "tt" && (state.tu || state.den) ? " theo ngày thanh toán" : "")
    + (total > list.length ? ` · hiện ${list.length} đơn mới nhất` : "")
    + (no_paid_mark ? ` · <span title="Trả công trước khi web bắt đầu ghi mốc thời gian đổi trạng thái">⋯ ${no_paid_mark} đơn đã trả công trước ${dmy((status_log_since || "").slice(0, 10)) || "khi có nhật ký"} không có ngày thanh toán</span>` : "");
  state.orders = Object.fromEntries(list.map(o => [o.id, o]));
  state.orderList = list;
  renderOrderCards();
  for (const o of list) if (state.picked.has(o.id)) state.picked.set(o.id, o);  // số liệu mới nhất
  renderTrackAll();
  renderPickbar();
}
// lọc theo chiến dịch thưởng: state.cd = id, "-" = đơn không gán chiến dịch, rỗng = tất cả; số = đơn theo bộ lọc + trạng thái + sàn + ĐVVC

  box.innerHTML = `<button class="${cur ? "" : "on"}" onclick="go('orders',{cd:''})">🎁 Mọi đơn<span class="n">${all}</span></button>`
    + cs.map(c => { const v = String(c.id || "-");

  window.postMessage({qld: "ghn", items}, location.origin);

window.addEventListener("message", async e => {
  const g = state.ghnRun, m = e.data;
  if (e.source !== window || !m || !g || !["ghn-captcha", "ghn-progress", "ghn-done", "error"].includes(m.qld)) return;
  if (m.qld === "ghn-captcha") {
    g.waiting = m.id;
    toast(`⏸ GHN hỏi xác minh đơn #${m.id}: bấm ô xác minh trong tab GHN vừa mở (chờ tối đa 2 phút)`);
  } else if (m.qld === "ghn-progress") {
    g.waiting = null; g.i = m.i;
    let ok = false;
    if (m.result?.ok) {
      try { const r = await fetch(`/api/orders/${m.id}/ghn-data`, {method: "POST", headers: {"Content-Type": "application/json"},
                                   body: JSON.stringify({data: m.result.data})}); ok = r.ok; } catch {}
    }
    ok ? g.ok++ : g.err++;
    if (g.single && $("#extra")) trackOrder(m.id, true);
  } else if (m.qld === "ghn-done") {
    state.ghnRun = null;
    toast(m.reason === "captcha" ? "⚠️ Dừng tra GHN vì captcha chưa được giải"
      : `🧩 Tra GHN xong ${g.ok}/${g.n} đơn${g.err ? ` · ${g.err} lỗi` : ""}${m.stopped ? " (đã dừng)" : ""}`, g.err > 0 || m.reason === "captcha");
    if (state.tab === "orders" && !g.single) loadOrders();
  } else if (m.qld === "error") {
    if (!g.i) state.ghnRun = null;
  }
  renderTrackAll();
});
async function trackAll() {
  const list = trackTargets().sort((a, b) => a.id - b.id);
  if (!list.length || state.trackRun) return;
  const run = state.trackRun = {i: 0, n: list.length, err: 0, stop: false};
  renderTrackAll();
  for (const o of list) {
    if (run.stop) break;
    run.i++; renderTrackAll();
    try {  // fetch thẳng (không qua api()) để lỗi 1 đơn không bật toast liên tục
      const r = await fetch(`/api/orders/${o.id}/track`);
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.ok === false) run.err++;
    } catch { run.err++; }
    if (run.i < run.n && !run.stop) {
      const [lo, hi] = TRACK_GAP_MS;
      await new Promise(res => setTimeout(res, lo + Math.random() * (hi - lo)));
    }
  }
  state.trackRun = null;
  toast(`🚚 Đã tra ${run.i}/${run.n} đơn${run.err ? ` · ${run.err} đơn lỗi` : ""}${run.stop ? " (đã dừng)" : ""}`, run.err > 0);

}

// trả công gộp nhiều đơn đã chọn: mỗi người đặt 1 QR + tổng công, bấm 1 lần → các đơn Đã nhận của người đó sang Thanh toán
const nameKey = s => String(s || "").toLowerCase().split(/\s+/).filter(Boolean).join(" ");
// thưởng săn sale mới đạt nhờ trả công các đơn này (cùng 1 người đặt): với mỗi chiến dịch của các đơn,
// số đơn đạt hiện có (Thanh toán / Hoàn thành) + số đơn sắp chuyển sang Thanh toán → số lần qua mốc mới × thưởng.
// Mốc đã qua từ trước coi như đã trả thưởng ở lần trả công đó (không tính lại).
// đơn đạt mốc thưởng (đơn thứ 5, 10… của người đặt trong chiến dịch, đã trả công)
const milestoneBadge = s => `<span class="badge b-done" title="Đơn này làm người đặt đạt mốc ${s.moc} đơn → được thưởng ${money(s.thuong)}">🏆 Đơn mốc ${s.n} · thưởng ${short(s.thuong)}</span>`;
function payBonus(orders) {
  const byC = new Map();
  for (const o of orders) if (o.chien_dich && payable(o)) byC.set(o.chien_dich, (byC.get(o.chien_dich) || 0) + 1);
  return [...byC].map(([cid, add]) => {
    const c = state.campaigns?.[cid];
    if (!c) return null;
    const p = c.people.find(p => nameKey(p.ten) === nameKey(orders[0].ten_nguoi_dat));
    const moc = Math.max(c.moc_don || 1, 1), before = p ? p.dat : 0, after = before + add;
    const lan = Math.floor(after / moc) - Math.floor(before / moc);
    // đơn nào trong lần trả này là đơn mốc (đơn thứ 5, 10…): xếp theo id như thứ tự bấm trả
    const mine = orders.filter(o => o.chien_dich === cid && payable(o)).sort((a, b) => a.id - b.id);
    const hits = mine.map((o, i) => [o, before + i + 1]).filter(([, n]) => n % moc === 0);
    return {c, add, before, after, lan, bonus: lan * c.thuong, con: moc - after % moc, hits};
  }).filter(Boolean);
}
// dòng thưởng trong bảng trả công + tổng cần chuyển (công + thưởng)
function payBonusRows(bs) {
  return bs.map(b => `<tr><td>🎁</td><td style="text-align:left">${esc(b.c.ten)} · ${b.before} → ${b.after} đơn
      ${b.lan ? `<b class="pos">đạt mốc ${b.c.moc_don}${b.lan > 1 ? ` × ${b.lan}` : ""}</b>
        <div class="muted">🏆 ${b.hits.map(([o, n]) => `đơn mốc thứ ${n}: #${o.id}`).join(" · ")}</div>` : `<span class="muted">còn ${b.con} đơn tới mốc</span>`}</td>
    <td class="r">${b.bonus ? `<b class="pos">+${money(b.bonus)}</b>` : "–"}</td></tr>`).join("");
}
function payTotal(cong, bs) {
  const bonus = bs.reduce((a, b) => a + b.bonus, 0);
  return `<div style="font-size:28px;font-weight:700;margin:6px 0">${money(cong + bonus)}</div>
    ${bonus ? `<div class="muted" style="margin-bottom:6px">công ${money(cong)} + thưởng ${money(bonus)}</div>` : ""}`;
}

// khoảng giữa 2 mốc "YYYY-MM-DD HH:MM:SS": "2 ngày 3 giờ" / "45 phút"
function durText(a, b) {
  const p = s => new Date(s.replace(" ", "T"));
  const secs = Math.max(0, (p(b) - p(a)) / 1000), d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
  return [d && `${d} ngày`, h && `${h} giờ`, !d && m && `${m} phút`].filter(Boolean).join(" ") || "dưới 1 phút";
}
// các mốc đổi trạng thái (db.order_status_log): tạo đơn = Đã đặt, rồi từng lần đổi kèm giờ, sau bao lâu, ai đổi
function statusTimeline(o) {
  const logs = o.status_log || [];
  const item = (st, at, note) => `<li style="--dot:${ST_COLOR[st] || "var(--muted)"}">${(STATUS[st] || ["•"])[0]} <b>${esc(st)}</b>
    · ${dmy(at.slice(0, 10))} ${at.slice(11, 16)}${note ? ` <span class="muted">· ${note}</span>` : ""}</li>`;
  const gap = logs.length ? logs[0].tu !== "Đã đặt" : o.trang_thai !== "Đã đặt";
  let prev = o.created_at;
  return `<div class="section-title" style="margin-top:14px">🕒 Các mốc trạng thái</div><ul class="st-timeline">
    ${item("Đã đặt", o.created_at, "tạo đơn")}
    ${gap ? `<li style="--dot:var(--line)"><span class="muted">⋯ đổi trạng thái trước ${o.status_log_since ? dmy(o.status_log_since.slice(0, 10)) : "khi có nhật ký"} chưa có mốc giờ</span></li>` : ""}
    ${logs.map(g => { const r = item(g.den, g.at, ["sau " + durText(prev, g.at), [g.nguon, g.nguoi].filter(Boolean).map(esc).join(" ")].filter(Boolean).join(" · ")); prev = g.at; return r; }).join("")}
  </ul>`;
}

async function afterQr(kind, id, then) {

function pickQr(kind, id, then) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = async () => {
    const f = inp.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { toast("Ảnh lớn quá 10MB", true); return; }
    toast("⏳ Đang tải ảnh lên…");
    const res = await fetch(`/api/qr/${kind}/${id}`, {method: "POST", headers: {"Content-Type": f.type || "image/jpeg"}, body: f});
    const d = await res.json().catch(() => ({}));
    if (!res.ok) { toast(d.detail || "Lỗi " + res.status, true); return; }
    toast("✅ Đã lưu QR – dùng chung cho mọi đơn của người này, bot cũng thấy");
    afterQr(kind, id, then);
  };
  inp.click();
}
async function deleteQr(kind, id) {

}

// 1 shop của 1 món sale (dùng ở tab Săn sale và Sản phẩm). price = giá thu gợi ý của sản phẩm → lãi ước tính / cái

const rankOf = s => s.uu_tien > 0 ? s.uu_tien : Infinity;
const mid = (lo, hi) => (lo + (hi || lo)) / 2;
// 1 mức giá / công đã lưu → số ước tính: khoảng → giữa, "dưới X" (lo 0) → X, "từ X trở lên" (hi = -1) → X
const est = (lo, hi) => !hi || hi < 0 ? (lo || 0) : !lo ? hi : (lo + hi) / 2;
function saleShopRow(s, price) {

  const lai = laiOf(s);
  return `<div class="shop ${s.active ? "" : "off"}">

          ${s.so_luong ? `<span>📦 SL ${s.so_luong}</span>` : ""}${lai !== null ? `<span class="${lai >= 0 ? "pos" : "neg"}">📈 lãi ~${short(lai)}${per}</span>` : ""}</div>
        ${s.tiers.map(t => {
          const l = laiOf(t);
          return `<div class="meta"><span>💰 hoặc ${esc(t.gia_label)}${t.pct ? ` <b class="pos">−${t.pct}%</b>${t.cap_label ? ` tối đa ${esc(t.cap_label)}` : ""}` : ""}</span>${t.cong_label ? `<span>🛠 công ${esc(t.cong_label)}</span>` : ""}${l !== null ? `<span class="${l >= 0 ? "pos" : "neg"}">📈 lãi ~${short(l)}${per}</span>` : ""}</div>`;
        }).join("")}
        <div class="links">${s.links.map((u, i) => `<div class="lk"><a href="${esc(u)}" target="_blank" rel="noopener">🔗 ${esc(u.replace(/^https?:\/\//, ""))}</a>${stockChip(s, i)}<button class="lk-del" title="Xóa link này" onclick="removeLink(${s.id},${i})">🗑</button></div>`).join("")}</div>

// ---------- còn hàng TikTok (tiện ích Chrome static/extension đọc trang trong Chrome của người dùng) ----------
const isTikTok = u => /^https?:\/\/([^/]*\.)?tiktok\.com\//i.test(u);
// v = stock_view của server: còn hàng tính theo phân loại cần mua (🎯 đã chọn / tự đoán theo tên sale / tổng)
function stockText(r, v) {
  if (!r.ok) return r.captcha ? ["⚠️ cần xác minh", "b-ordered"] : ["⚠️ lỗi", "b-muted"];
  v = v || {total: r.total, in_stock: r.in_stock, names: []};
  const which = v.names?.length ? ` · ${v.mode === "auto" ? "🔮" : "🎯"} ${v.names.join(", ")}` : "";
  return [(v.in_stock ? `📦 còn ${v.total}` : "⛔ hết hàng") + which, v.in_stock ? "b-done" : "b-cancel"];
}
function stockChip(s, i) {
  const u = s.links[i], r = (s.stock || {})[u];

window.addEventListener("message", async e => {
  if (e.source !== window || !e.data || !state.check) return;
  const m = e.data, c = state.check;
  if (m.qld === "captcha") {
    c.waiting = m.link;
  } else if (m.qld === "progress") {
    c.waiting = null; c.done = m.i; c.checked.add(m.link);
    let upd = null;
    try { upd = await post(`/sales/${m.sale_id}/stock`, {link: m.link, result: m.result}); state.sales[upd.id] = upd; } catch {}
    // đếm còn / hết theo phân loại cần mua (server tính), không theo tổng cả link
    m.result.ok ? ((upd?.stock_view?.[m.link] || m.result).in_stock ? c.ok++ : c.out++) : c.bad++;
  } else if (m.qld === "done") {
    c.finished = true; c.stopped = m.stopped; c.reason = m.reason;
    toast(m.reason === "captcha" ? "⚠️ Dừng vì TikTok hỏi captcha" : `📦 Xong: còn hàng ${c.ok} · hết ${c.out}${c.bad ? ` · lỗi ${c.bad}` : ""}`, m.reason === "captcha");
    if (["sales", "products"].includes(state.tab)) refresh();
  } else if (m.qld === "error") {
    toast(m.error, true); if (!c.done) state.check = null;
  } else return;
  const box = $("#check-box"); if (box) box.innerHTML = stockBody();
});

function tierInput(el, src) {

// số tiền gõ tay → số (đọc như bot, qua /api/money): "dưới 4tr3" → 4300000, khoảng → số lớn
const _moneyCache = {};
async function moneyVal(text) {
  text = (text || "").trim();
  if (!text) return 0;
  if (!(text in _moneyCache)) _moneyCache[text] = await api(`/money?v=${encodeURIComponent(text)}`).catch(() => ({}));
  const {lo, hi} = _moneyCache[text];
  return hi > 0 ? hi : lo || 0;
}
async function calcTier(row) {
  const goc = await gocTotal(), cap = await moneyVal(row.querySelector(".tier-cap").value);
  const pct = row.querySelector(".tier-pct"), gia = row.querySelector(".tier-gia");
  if (!goc) return;
  if (row.dataset.src === "pct") {  // như utils.price_after_discount: giảm p% nhưng không quá "giảm tối đa"
    const p = parseFloat(pct.value.replace(",", ".").replace("%", ""));
    if (p > 0 && p < 100) gia.value = short(Math.round((goc - Math.min(goc * p / 100, cap || Infinity)) / 1000) * 1000);
  } else {
    const v = await moneyVal(gia.value);
    pct.value = v && v < goc ? Math.round((1 - v / goc) * 100) : "";
  }
}
// mức giá khác → dòng muc_gia: "11tr2 công 100 giảm 20% tối đa 1tr" (% + tối đa chỉ khi gõ theo %)
const tiersText = rows => rows.filter(t => t.gia).map(t => t.gia + (t.cong ? ` công ${t.cong}` : "")
  + (t.src === "pct" && t.pct ? ` giảm ${t.pct.replace("%", "")}%` + (t.cap ? ` tối đa ${t.cap}` : "") : "")).join("\n");
async function saveSale(id) {
  const rows = [...document.querySelectorAll("#tier-rows .tier-row")].map(r => ({src: r.dataset.src,
    pct: r.querySelector(".tier-pct").value.trim(), cap: r.querySelector(".tier-cap").value.trim(),
    gia: r.querySelector(".tier-gia").value.trim(), cong: r.querySelector(".tier-cong").value.trim()}));
  const [main, ...extra] = rows;
  const form = formData();
  const gocChanged = !id || form.gia_goc !== String(saveSale.orig.gia_goc) || form.so_luong !== String(saveSale.orig.so_luong);
  const data = {...form, cong: main.cong, muc_gia: tiersText(extra), giam_toi_da: main.src === "pct" ? main.cap : ""};
  if (form.gia_goc.trim()) {
    const total = await gocTotal();
    if (!total) return toast("Không đọc được giá gốc", true);
    data.gia_goc = total.toLocaleString("vi-VN");
  }
  if (main.src === "pct" && main.pct) {
    if (!data.gia_goc.trim()) return toast("Nhập giá gốc để tính theo % giảm", true);
    data.giam_pt = main.pct;  // server tính giá mua được, đổi giá gốc sau này vẫn giữ đúng %
  } else {
    data.gia_sale = main.gia; data.giam_pt = "";
  }
  if (id) {
    const body = Object.fromEntries(Object.entries(data).filter(([k, v]) => k === "gia_goc" ? gocChanged : String(saveSale.orig[k] ?? "") !== v));
    if (Object.keys(body).length) await patch(`/sales/${id}`, body);
    toast("✏️ Đã lưu");
  } else {
    const r = await post("/sales", data);
    toast(`➕ Đã thêm #${r.ids.join(", #")}`); refreshMeta();
  }
  closeModal(); refresh();
}

async function viewProducts() {
  const {products: list, orphans} = await api("/products");
  state.products = Object.fromEntries(list.map(p => [p.id, p]));
  state.sales = Object.fromEntries([...list, ...orphans].flatMap(p => p.sales).map(s => [s.id, s]));
  const card = p => `<div class="card product">
      <div class="head" style="flex-wrap:wrap;gap:6px">
        <b>${esc(p.ten)}</b>
        <span class="meta">${p.id ? `<span>💵 thu ${p.gia_label ? esc(p.gia_label) : "–"}</span><span>🧾 ${p.so_don} đơn</span>` : ""}
          <span>🔥 ${p.sales.filter(s => s.active).length}/${p.sales.length} shop sale</span></span></div>
      ${productImages(p)}
      ${[...p.sales].sort((a, b) => b.active - a.active || rankOf(a) - rankOf(b)).map(s => saleShopRow(s, p.gia_goi_y ? p : null)).join("")
        || '<div class="shop meta">Chưa có shop sale</div>'}
      <div class="actions" style="padding:10px 14px">
        <button class="btn sm" onclick="pickProductImages(${jsq(p.ten)})">🖼 Thêm ảnh</button>
        ${p.id ? `<button class="btn sm" onclick="productForm(${p.id})">✏️ Sửa sản phẩm</button>`
               : `<button class="btn sm" onclick="productForm(0, ${jsq(p.ten)})">＋ Thêm vào danh mục</button>`}
        <button class="btn sm" onclick="saleForm(0, ${jsq(p.ten)})">🏪 Thêm shop sale</button></div>
    </div>`;
  // đang sale (nhiều shop đang bật trước) → có shop nhưng đã tắt hết → chưa có shop sale; cùng nhóm theo tên
  const nActive = p => p.sales.filter(s => s.active).length;
  const rank = p => nActive(p) ? 0 : p.sales.length ? 1 : 2;
  const prio = p => Math.min(Infinity, ...p.sales.filter(s => s.active).map(rankOf));  // thứ tự nhỏ nhất của shop đang sale
  const sorted = [...list].sort((a, b) => rank(a) - rank(b) || prio(a) - prio(b) || nActive(b) - nActive(a) || a.ten.localeCompare(b.ten, "vi"));
  const groups = [["🔥 Đang sale", 0], ["⛔ Hết sale", 1], ["Chưa có shop sale", 2]]
    .map(([title, r]) => [title, sorted.filter(p => rank(p) === r)]).filter(([, ps]) => ps.length);
  orphans.sort((a, b) => prio(a) - prio(b) || nActive(b) - nActive(a));
  $("#view").innerHTML = `
    ${groups.map(([title, ps]) => `<div class="section-title">${title} · ${ps.length}</div>
      <div class="grid cards">${ps.map(card).join("")}</div>`).join("") || '<div class="empty">Chưa có sản phẩm</div>'}
    ${orphans.length ? `<div class="section-title">Món sale chưa có trong danh mục sản phẩm</div>
      <div class="grid cards">${orphans.map(o => card({ten: o.ten_sp, sales: o.sales, images: o.images})).join("")}</div>` : ""}
    <button class="btn primary fab" onclick="productForm()">＋ Thêm sản phẩm</button>`;
}

function pickProductImages(name) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
  inp.onchange = async () => {
    const files = [...inp.files];
    if (!files.length) return;
    let ok = 0;
    for (const [i, f] of files.entries()) {
      if (f.size > 10 * 1024 * 1024) { toast(`Ảnh ${f.name} lớn quá 10MB`, true); continue; }
      toast(`⏳ Đang tải ảnh ${i + 1}/${files.length}…`);
      const res = await fetch(`/api/product-images?name=${encodeURIComponent(name)}`,
        {method: "POST", headers: {"Content-Type": f.type || "image/jpeg"}, body: f});
      const d = await res.json().catch(() => ({}));
      if (!res.ok) { toast(d.detail || "Lỗi " + res.status, true); break; }
      ok++;
    }
    if (ok) toast(`✅ Đã thêm ${ok} ảnh – bot /sale gửi kèm`);
    viewProducts();
  };
  inp.click();
}

const OUTCOMES = [["ok", "✅", "thành công"], ["wait", "⏳", "đang đặt"], ["fail", "❌", "hủy"]];
function sanRow(src, c) {
  const total = c.ok + c.wait + c.fail;
  return `<div class="san-item">
    <div class="san-head"><b>${sanTag(src, "")}</b><span class="san-bar">${OUTCOMES.map(([k]) => c[k]
        ? `<i class="${k}" style="flex:${c[k]}"></i>` : "").join("")}</span><b>${total} đơn</b></div>
    <div class="san-chips">${OUTCOMES.filter(([k]) => c[k]).map(([k, icon, label]) =>
        `<span class="chip ${k}">${icon} ${c[k]} ${label}</span>`).join("")}</div>
  </div>`;
}
// tìm không dấu: "hung" khớp "Hùng", "đ" = "d"
const foldText = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
function personMatches(p, q) {
  if (!q) return true;
  const hay = foldText([p.ten, p.sdt, p.zalo, p.facebook, p.ghi_chu, p.tim, "#" + p.id].join(" | "));
  const digits = q.replace(/[\s.\-]/g, "");
  // mọi từ đều phải khớp; số điện thoại gõ có dấu cách / chấm vẫn tìm được
  return foldText(q).split(/\s+/).every(w => hay.includes(w)) || (/^\+?\d{3,}$/.test(digits) && hay.includes(digits.replace(/^\+84/, "0")));
}

// hiện ở trang Đơn hàng (trên bảng 👤 Theo người đặt), khung gập lại được; chiến dịch có khoảng ngày riêng, không theo bộ lọc đơn
async function loadBonus() {
  const box = $("#bonus");
  if (!box) return;
  const list = (await api("/campaigns")).sort((a, b) => b.active - a.active);  // đang bật lên trước
  if (!$("#bonus")) return;  // đã rời trang Đơn hàng
  state.campaigns = Object.fromEntries(list.map(c => [c.id, c]));
  const today = ymd(new Date());
  // lựa chọn chiến dịch cho đơn (như db.campaign_choices): chiến dịch đang bật → cập nhật ngay khi thêm / bật / tắt / xóa
  if (state.meta) state.meta.campaigns = list.filter(c => c.active).sort((a, b) => a.tu.localeCompare(b.tu)).map(c => [c.id, c.ten]);
  const on = list.filter(c => c.active);
  const sumOn = on.reduce((a, c) => a + c.tong_thuong, 0);
  // ngày chỉ để nhắc: chưa tới ngày bắt đầu / đã qua ngày kết thúc
  const dateNote = c => c.tu > today ? '<span class="badge b-muted">chưa tới ngày</span>' : c.den && c.den < today ? '<span class="badge b-muted">đã qua ngày kết thúc</span>' : "";
  box.innerHTML = `<details class="card by-person" ${state.byBonus ? "open" : ""} ontoggle="state.byBonus=this.open;save()">
    <summary><b>🎁 Thưởng săn sale</b><span class="muted">${list.length ? `${list.length} chiến dịch${on.length ? ` · đang bật ${on.length} · thưởng ${short(sumOn)}` : " · không có chiến dịch nào đang bật"}` : "chưa có chiến dịch"}</span></summary>
    <div class="bonus-body">
      <div class="toolbar" style="margin:0"><button class="btn sm primary" onclick="campaignForm()">＋ Thêm chiến dịch</button>
        <span class="muted">Mỗi người đặt cứ N đơn gán vào chiến dịch (💵 Thanh toán / ✅ Hoàn thành) được thưởng · chọn chiến dịch ở từng đơn hoặc ☑ chọn nhiều đơn → 🎁 Gán chiến dịch · bot: /thuongsale</span></div>
      ${list.map(c => {
        const rule = `Cứ <b>${c.moc_don} đơn</b> thưởng <b>${esc(c.thuong_label)}</b>`;
        return `<div class="campaign ${c.active ? "" : "off"}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <label class="switch" title="${c.active ? "Đang bật – bấm để tắt" : "Đã tắt – bấm để bật"}"><input type="checkbox" ${c.active ? "checked" : ""}
              onchange="toggleCampaign(${c.id},this.checked)"><span></span></label>
            <b>🎁 ${esc(c.ten)}</b> ${c.active ? '<span class="badge b-done">✅ đang bật</span>' : '<span class="badge b-muted">⏸ đã tắt</span>'} ${dateNote(c)}</span>
          <span class="actions"><button class="btn sm" onclick="go('orders',{status:'all',q:'',tu:'',den:'',cd:'${c.id}'})">🧾 Đơn</button>
            <button class="btn sm" onclick="campaignForm(${c.id})">✏️ Sửa</button>
            <button class="btn sm bad" onclick="removeRec('campaigns',${c.id})">🗑</button></span></div>
        <div class="muted" style="margin:6px 0;font-size:13px">📅 ${dmy(c.tu)} → ${c.den ? dmy(c.den) : "nay"} · ${rule}</div>
        <div class="muted" style="margin-bottom:8px;font-size:13px">Tổng thưởng <b style="font-size:18px;color:var(--text)">${money(c.tong_thuong)}</b> · ${c.tong_dat} đơn đạt${c.tong_dang_dat ? ` · ${c.tong_dang_dat} đơn ⏳ đang đặt` : ""}${c.tong_nhan ? ` · ${c.tong_nhan} đơn 📦 đã nhận, chưa trả công` : ""}${c.tong_cho ? " (chưa tính)" : ""}${c.tong_cong ? ` · Tổng công <b style="color:var(--text)">${money(c.tong_cong)}</b>${c.tong_cong_chua_tra ? ` (chưa trả ${money(c.tong_cong_chua_tra)})` : ""}` : ""}</div>
        ${c.people.length ? `<div class="scroll"><table><tr><th>Người đặt</th><th class="r" title="Đơn đã gán, còn ⏳ Đã đặt (chưa nhận hàng) – chưa tính thưởng">Đang đặt</th><th class="r" title="Đơn đã gán, 📦 Đã nhận hàng nhưng chưa trả công – chưa tính thưởng, trả công là được tính">Đã nhận</th><th class="r" title="💵 Thanh toán / ✅ Hoàn thành">Đơn đạt</th><th class="r" title="Tổng công đặt mọi đơn đã gán vào chiến dịch (không tính đơn hủy); dòng nhỏ = phần chưa trả">Tổng công</th><th class="r">Quà</th><th class="r">Tới lần sau</th></tr>
          ${c.people.map(p => `<tr class="click" onclick="go('orders',{status:'all',q:${jsq(p.ten)},tu:'',den:'',cd:'${c.id}'})" title="Xem đơn của ${esc(p.ten)} trong chiến dịch">
            <td>${esc(p.ten)}</td>
            <td class="r ${p.dang_dat ? "" : "muted"}">${p.dang_dat || "–"}</td><td class="r ${p.nhan ? "" : "muted"}">${p.nhan ? `<b style="color:var(--teal)">${p.nhan}</b>` : "–"}</td><td class="r">${p.dat}</td><td class="r">${p.cong ? `<b>${short(p.cong)}</b>${p.cong_chua_tra ? `<div class="muted" style="font-size:12px">chưa trả ${short(p.cong_chua_tra)}</div>` : ""}` : '<span class="muted">–</span>'}</td><td class="r"><b class="${p.thuong ? "pos" : ""}">${p.thuong ? short(p.thuong) + (p.lan > 1 ? ` <span class="muted">(${p.lan} lần)</span>` : "") : "–"}</b></td>
            <td class="r muted">còn ${p.con} đơn</td></tr>`).join("")}</table></div>` : '<div class="empty">Chưa có đơn nào gán vào chiến dịch này</div>'}
      </div>`;
      }).join("")}
    </div></details>`;
}
async function toggleCampaign(id, on) {
  await post(`/campaigns/${id}/active`, {active: on ? 1 : 0});
  toast(on ? "✅ Bật chiến dịch" : "⏸ Tắt chiến dịch – không hiện để chọn cho đơn nữa"); loadBonus(); renderPickbar();
}
function campaignForm(id) {
  const c = id ? state.campaigns[id] : {active: 1};
  const orig = {ten: c.ten || "", tu: c.tu ? dmy(c.tu) : dmy(ymd(new Date())), den: c.den ? dmy(c.den) : "",
                moc_don: c.moc_don || 5, thuong: c.thuong ? short(c.thuong) : ""};
  openModal(`${modalHead(id ? `✏️ Sửa chiến dịch` : "＋ Thêm chiến dịch thưởng")}
    <div class="meta">Tính cho từng người đặt: đơn gán vào chiến dịch, ở trạng thái 💵 Thanh toán / ✅ Hoàn thành</div>
    <div class="form">${[
      ["ten", "Tên chiến dịch *", "text", orig.ten, {full: true, ph: "vd Sale 11/11"}],
      ["tu", "Từ ngày *", "text", orig.tu, {ph: "dd/mm/yyyy hoặc 03112026"}],
      ["den", "Đến ngày (trống = đến nay)", "text", orig.den, {ph: "dd/mm/yyyy hoặc 15112026"}],
      ["moc_don", "Cứ bao nhiêu đơn *", "num", orig.moc_don, {ph: "vd 5"}],
      ["thuong", "Thì thưởng *", "money", orig.thuong, {ph: "vd 100k"}],
      ["active", "Trạng thái", "select", c.active ? "1" : "0", {options: [["1", "✅ Đang bật (chọn được cho đơn)"], ["0", "⏸ Tắt"]], full: true}],
    ].map(field).join("")}</div>
    <div class="foot"><button class="btn" onclick="closeModal()">Hủy</button>
      <button class="btn primary" onclick="saveCampaign(${id || 0})">${id ? "Lưu" : "Thêm"}</button></div>`);
}
async function saveCampaign(id) {
  const d = formData();
  const tu = parseDmy(d.tu), den = parseDmy(d.den);
  if (!tu) return toast("Ngày bắt đầu không đúng, gõ dd/mm/yyyy hoặc 03112026", true);
  if (den === null) return toast("Ngày kết thúc không đúng, gõ dd/mm/yyyy hoặc 15112026", true);
  const body = {...d, tu, den};
  if (id) await patch(`/campaigns/${id}`, body); else await post("/campaigns", body);
  toast(id ? "✏️ Đã lưu" : "🎁 Đã thêm chiến dịch"); closeModal(); await refreshMeta(); loadBonus();
}

async function viewPhones() {
  const list = await api("/phones");
  state.phones = Object.fromEntries(list.map(p => [p.id, p]));
  const filt = state.phoneFilter || "all";
  const shown = list.filter(p => filt === "all" || (filt === "mine" ? p.cua_toi : filt === "free" ? !p.da_su_dung : p.da_su_dung))
                    .sort((a, b) => b.cua_toi - a.cua_toi);
  const segs = [["all", "Tất cả"], ["mine", "📱 Của tôi"], ["free", "🟢 Free"], ["busy", "🔴 Đang dùng"]];
  $("#view").innerHTML = `
    <div class="toolbar"><div class="seg">${segs.map(([k, l]) => `<button class="${filt === k ? "on" : ""}"
      onclick="state.phoneFilter='${k}';viewPhones()">${l}</button>`).join("")}</div>
      <span class="meta">${shown.length} số</span></div>
    <div class="grid cards">${shown.map(p => `
      <div class="card" style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <b style="font-size:16px">${p.cua_toi ? "📱" : "👤"} ${esc(p.sdt)}</b>
          <span class="badge ${p.da_su_dung ? "b-cancel" : "b-done"}">${p.da_su_dung ? "🔴 Đang dùng" : "🟢 Free"}</span></div>
        <div class="meta">${p.may ? `<span>📲 ${esc(p.may)}</span>` : ""}${p.ghi_chu ? `<span>📝 ${esc(p.ghi_chu)}</span>` : ""}
          <span>${p.so_don} đơn</span>${p.so_dia_chi > 1 ? `<span>${p.so_dia_chi} địa chỉ</span>` : ""}</div>
        ${Object.keys(p.theo_san).length ? `<div class="phone-san">${Object.entries(p.theo_san).map(([src, c]) =>
          `<div><b>${sanTag(src, "🛒")}</b>${OUTCOMES.filter(([k]) => c[k]).map(([k, icon, label]) =>
            `<span class="chip ${k}" title="${label}">${icon} ${c[k]}</span>`).join("")}</div>`).join("")}</div>` : ""}
        <div class="actions">
          <button class="btn sm" onclick="go('orders',{status:'all',q:${jsq(p.sdt)}})">🧾 Đơn</button>
          <button class="btn sm" onclick="phoneForm(${p.id})">✏️ Sửa</button>
        </div>
      </div>`).join("") || '<div class="empty">Không có số nào</div>'}</div>
    <button class="btn primary fab" onclick="phoneForm()">＋ Thêm số</button>`;
}
function phoneForm(id) {
  const p = id ? state.phones[id] : {cua_toi: 1};
  const yes = ["Của tôi", "Người khác"], used = ["Free", "Đang dùng"];
  const orig = {sdt: p.sdt || "", may: p.may || "", ghi_chu: p.ghi_chu || "",
                cua_toi: p.cua_toi ? yes[0] : yes[1], da_su_dung: used[p.da_su_dung ? 1 : 0]};
  openModal(`${modalHead(id ? `✏️ ${esc(p.sdt)}` : "＋ Thêm số")}
    <div class="form">${id ? "" : field(["sdt", "Số điện thoại", "text", "", {full: true}])}
      ${field(["cua_toi", "Chủ số", "select", orig.cua_toi, {options: yes}])}
      ${field(["may", "Lắp ở máy", "text", orig.may])}
      ${id ? field(["da_su_dung", "Trạng thái", "select", orig.da_su_dung, {options: used}]) : ""}
      ${field(["ghi_chu", "Ghi chú", "text", orig.ghi_chu, {full: !id}])}</div>
    <div class="foot">${id ? `<button class="btn bad left" onclick="removeRec('phones',${id})">🗑 Xóa</button>` : ""}
      <button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="savePhone(${id || 0})">Lưu</button></div>`);
  savePhone.orig = orig;
}
async function savePhone(id) {
  const b = id ? changed(savePhone.orig) : formData();
  if ("cua_toi" in b) b.cua_toi = b.cua_toi === "Của tôi" ? 1 : 0;
  if ("da_su_dung" in b) b.da_su_dung = b.da_su_dung === "Đang dùng" ? 1 : 0;
  if (id) { if (Object.keys(b).length) await patch(`/phones/${id}`, b); }
  else await post("/phones", b);
  toast("✏️ Đã lưu"); closeModal(); viewPhones();
}

// ---------- 🏍 giao hàng: bưu cục / kho giao cuối + nhân viên giao (tổng hợp từ hành trình đã lưu) ----------
const LM_STATE = {delivered: ["✅ Đã giao", "b-done"], giao: ["🏍 Đang giao", "b-accent"], post: ["📮 Ở bưu cục", "b-ordered"],
                  returned: ["↩️ Hoàn / hủy", "b-cancel"]};
const hrs = h => h == null ? "" : h < 24 ? `${h} giờ` : `${Math.round(h / 24 * 10) / 10} ngày`;
async function viewLastMile() {
  $("#view").innerHTML = `<div class="toolbar">
      <input class="input grow" placeholder="🔍 Tìm bưu cục, nhân viên, SĐT, địa chỉ, mã vận đơn, #đơn…" value="${esc(state.lmQ || "")}"
        oninput="clearTimeout(this._t);this._t=setTimeout(()=>{state.lmQ=this.value;renderLastMile()},250)">
      <span id="lm-seg" class="seg"></span>
      <button class="btn" onclick="warehouseList()" title="Ghi địa chỉ thật của kho / bưu cục giao (tên đúng như trong hành trình)">🏭 Địa chỉ kho</button></div>
    <div class="meta" style="margin:6px 0 0">Tự tổng hợp từ hành trình đã lưu (mỗi lần bot / web tra hành trình là cập nhật).
      Chỉ J&amp;T ghi tên + SĐT nhân viên giao; SPX, GHN chỉ có tên kho / bưu cục giao cuối.</div>
    <div id="lastmile"><div class="empty">⏳ Đang tải…</div></div>`;
  [state.lastMile] = await Promise.all([api("/last-mile"), loadWarehouses()]);

}
function renderLastMile() {
  const data = state.lastMile || [];
  const q = (state.lmQ || "").trim().toLowerCase().replace(/^#/, "");
  const hit = (...xs) => !q || xs.some(x => String(x ?? "").toLowerCase().includes(q));
  $("#lm-seg").innerHTML = [["", "Tất cả", data.reduce((a, c) => a + c.don, 0)], ...data.map(c => [c.carrier, c.carrier, c.don])]
    .map(([k, l, n]) => `<button class="${(state.lmVc || "") === k ? "on" : ""}" onclick="state.lmVc=${jsq(k)};renderLastMile()">${esc(l)}<span class="n">${n}</span></button>`).join("");
  const itemHit = it => hit(it.ma_don, it.courier, it.latest, ...it.orders.flatMap(o => [o.id, o.ten_nguoi_dat, o.ten_tren_don, o.dia_chi, o.ten_sp]));
  const html = data.filter(c => !state.lmVc || c.carrier === state.lmVc).map(c => {
    const posts = c.posts.map(p => {
      const w = whFor(p.post);
      const postHit = hit(p.post, w?.dia_chi, w?.ghi_chu) || p.couriers.some(k => hit(k.name, ...k.phones));
      const items = postHit ? p.items : p.items.filter(itemHit);
      return items.length ? {...p, shown: items} : null;
    }).filter(Boolean);
    if (!posts.length) return "";
    return `<div class="section-title">${vcTag(c.carrier)} ${esc(c.carrier)} <small>${posts.length} nơi giao · ${c.don} đơn${c.has_names ? "" : " · hãng không ghi tên nhân viên giao"}</small></div>
      <div class="grid cards lm-grid">${posts.map(p => lastMilePost(p)).join("")}</div>`;
  }).join("");
  $("#lastmile").innerHTML = html || `<div class="empty">${q ? "Không có gì khớp" : "Chưa có đơn nào tới bưu cục giao cuối trong hành trình đã lưu"}</div>`;
}

  const couriers = p.couriers.length ? `<div class="lm-couriers"><table><tr><th>Nhân viên giao</th><th>SĐT</th><th class="r">Đã giao</th><th>Hay giao tới</th></tr>
      ${p.couriers.map(k => `<tr><td><b>${esc(k.name)}</b><div class="muted">${k.first === k.last ? dmy(k.first) : `${dmy(k.first)} → ${dmy(k.last)}`}</div></td>
        <td>${k.phones.map(ph => `<a href="tel:${esc(ph)}">${esc(ph)}</a> <button class="btn xs" title="Chép SĐT" onclick="copyText(${jsq(ph)})">📋</button>`).join("<br>") || "–"}</td>
        <td class="r"><b>${k.delivered}</b>${k.don > k.delivered ? `<span class="muted">/${k.don}</span>` : ""}</td>
        <td class="muted">${k.dia_chi.slice(0, 3).map(d => `${esc(d.dc)} <b>×${d.n}</b>`).join("<br>")}</td></tr>`).join("")}</table></div>`
    : "";
  const items = p.shown.map(it => {
    const [label, cls] = LM_STATE[it.state] || [it.state, "b-muted"];
    return it.orders.map(o => `<tr class="click" onclick="orderDetail(${o.id})" title="Xem đơn #${o.id}">
        <td>#${o.id}<div class="muted">${esc(it.ma_don)}</div></td>
        <td><span class="badge ${cls}">${label}</span>${it.courier ? `<div class="muted">🧑‍✈️ ${esc(it.courier)}</div>` : ""}</td>
        <td>${esc(o.ten_nguoi_dat || "")}${o.ten_tren_don ? ` <span class="muted">· 🪪 ${esc(o.ten_tren_don)}</span>` : ""}
          <div class="muted">${esc(o.dia_chi || "")}</div></td>
        <td class="muted">tới ${dt(it.arrived)}${it.done ? `<br>giao ${dt(it.done)} · ${hrs(it.hours)}` : ""}
          ${it.tries > 1 ? `<br>🔁 ${it.tries} lần giao` : ""}${it.fails ? `<br>⚠️ ${it.fails} lần lỗi` : ""}</td></tr>`).join("")
      || `<tr><td colspan="4"><span class="badge ${cls}">${label}</span> ${esc(it.ma_don)} <span class="muted">(không khớp đơn nào)</span></td></tr>`;
  }).join("");
  return `<div class="card lm-post">
    <div class="head" style="flex-wrap:wrap;gap:6px"><b>📮 ${esc(p.post)}</b>
      <span class="meta"><span>🧾 ${p.don} đơn</span><span>✅ ${p.delivered} đã giao</span>
        ${p.dang_giao ? `<span>🏍 ${p.dang_giao} đang giao</span>` : ""}${p.returned ? `<span>↩️ ${p.returned} hoàn/hủy</span>` : ""}
        ${p.avg_hours != null ? `<span title="Trung bình từ lúc tới bưu cục / kho giao cuối đến lúc giao xong">⏱ TB ${hrs(p.avg_hours)}</span>` : ""}
        <span>🕒 gần nhất ${dt(p.last)}</span></span></div>
    ${whLine(p.post)}
    ${couriers}
    <details class="lm-orders"${state.lmQ ? " open" : ""}><summary>🧾 ${p.shown.length} đơn${p.shown.length < p.don ? ` / ${p.don}` : ""}</summary>
      <div class="scroll"><table>${items}</table></div></details>
  </div>`;
}

// ---------- sổ địa chỉ kho / bưu cục của hãng (tên đúng như trong hành trình → địa chỉ thật) ----------
async function loadWarehouses() {
  try { state.warehouses = await api("/warehouses"); } catch { state.warehouses = state.warehouses || []; }
  return state.warehouses;
}
// kho có tên nằm trong chữ (tên kho trong hành trình, mốc hành trình), không phân biệt hoa thường / dấu; tên dài nhất thắng
function whFor(text) {
  const t = foldText(text).replace(/\s+/g, " ");
  let best = null;
  for (const w of state.warehouses || []) {
    const k = foldText(w.ten).replace(/\s+/g, " ");
    if (k && t.includes(k) && (!best || k.length > best.k.length)) best = {k, w};
  }
  return best?.w || null;
}
function whLine(post) {
  const w = whFor(post);
  if (!w) return `<div class="wh-addr"><button class="btn xs" onclick="warehouseForm(0, ${jsq(post)})">＋ Ghi địa chỉ kho này</button></div>`;
  return `<div class="wh-addr">📍 <b>${esc(w.dia_chi || "chưa ghi địa chỉ")}</b>${w.ghi_chu ? ` <span class="muted">· ${esc(w.ghi_chu)}</span>` : ""}
    ${w.dia_chi ? `<button class="btn xs" title="Chép địa chỉ" onclick="copyText(${jsq(w.dia_chi)})">📋</button>` : ""}
    <button class="btn xs" onclick="warehouseForm(${w.id})">✏️</button></div>`;
}
// tên kho / bưu cục đã gặp trong hành trình (tab Giao hàng) → gợi ý khi gõ tên
const whSeen = () => [...new Set((state.lastMile || []).flatMap(c => c.posts.map(p => p.post)))].sort();
async function warehouseList() {
  const list = await loadWarehouses();
  const missing = whSeen().filter(p => !whFor(p));
  openModal(`${modalHead(`🏭 Địa chỉ kho / bưu cục (${list.length})`)}
    <div class="meta" style="margin-bottom:8px">Ghi tên <b>đúng như trong hành trình</b> (vd <code>20-HNI Abc 1 Hub</code>, không phân biệt hoa thường / dấu).
      Mốc hành trình nhắc tới tên đó sẽ hiện kèm địa chỉ.</div>
    <div class="scroll"><table class="wh-list">${list.map(w => `<tr class="click" onclick="warehouseForm(${w.id})">
        <td><b>${esc(w.ten)}</b>${w.ghi_chu ? `<div class="muted">${esc(w.ghi_chu)}</div>` : ""}</td>
        <td>${esc(w.dia_chi || "–")}</td></tr>`).join("") || `<tr><td class="muted">Chưa ghi kho nào</td></tr>`}</table></div>
    ${missing.length ? `<div class="meta" style="margin-top:10px">Kho đã gặp trong hành trình, chưa có địa chỉ:</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${missing.map(p =>
        `<button class="btn xs" onclick="warehouseForm(0, ${jsq(p)})">＋ ${esc(p)}</button>`).join("")}</div>` : ""}
    <div class="foot"><button class="btn" onclick="closeModal()">Đóng</button>
      <button class="btn primary" onclick="warehouseForm(0)">＋ Thêm kho</button></div>`);
}
function warehouseForm(id, name) {
  const w = id ? (state.warehouses || []).find(x => x.id === id) || {} : {ten: name || ""};
  openModal(`${modalHead(id ? `✏️ Kho ${esc(w.ten)}` : "＋ Thêm địa chỉ kho")}
    <div class="form">
      ${field(["ten", "Tên kho / bưu cục (đúng như trong hành trình)", "text", w.ten || "", {full: true, list: whSeen(), ph: "vd 20-HNI Abc 1 Hub"}])}
      ${field(["dia_chi", "Địa chỉ", "textarea", w.dia_chi || "", {full: true, ph: "Số nhà, đường, phường, quận…"}])}
      ${field(["ghi_chu", "Ghi chú", "text", w.ghi_chu || "", {full: true, ph: "giờ mở cửa, SĐT bưu cục, cách tới…"}])}
    </div>
    <div class="foot">${id ? `<button class="btn bad left" onclick="deleteWarehouse(${id})">🗑 Xóa</button>` : ""}
      <button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveWarehouse(${id || 0})">Lưu</button></div>`);
}
async function saveWarehouse(id) {
  const b = formData();
  if (!b.ten.trim()) { toast("Thiếu tên kho", true); return; }
  if (id) await patch(`/warehouses/${id}`, b); else await post("/warehouses", b);
  toast("✏️ Đã lưu địa chỉ kho"); closeModal(); await loadWarehouses();
  if (state.tab === "lastmile" && $("#lastmile")) renderLastMile();
}
async function deleteWarehouse(id) {
  if (!confirm("Xóa địa chỉ kho này?")) return;
  await del(`/warehouses/${id}`); toast("🗑 Đã xóa"); closeModal(); await loadWarehouses();
  if (state.tab === "lastmile" && $("#lastmile")) renderLastMile();
}

// ---------- sổ địa chỉ đặt hàng (bot /diachi) ----------
function viewAddresses() {
  $("#view").innerHTML = `
    <div class="toolbar">
      <input class="input grow" placeholder="🔍 Tìm địa chỉ…" value="${esc(state.addrQ || "")}"
        oninput="clearTimeout(this._t);this._t=setTimeout(()=>{state.addrQ=this.value;loadAddresses()},300)">
      <span class="meta" id="addr-count"></span></div>
    <div id="addresses" class="grid cards">${skelCards()}</div>
    <button class="btn primary fab" onclick="addressForm()">＋ Thêm địa chỉ</button>`;
  loadAddresses();
}
async function loadAddresses() {
  if (!$("#addresses")) return viewAddresses();
  const list = await api("/addresses?q=" + encodeURIComponent(state.addrQ || ""));
  state.addresses = Object.fromEntries(list.map(a => [a.id, a]));
  $("#addr-count").textContent = `${list.length} địa chỉ`;
  $("#addresses").innerHTML = list.map(a => `
    <div class="card addr-card">
      <div class="addr-text">${esc(a.noi_dung)}</div>
      <div class="actions"><span class="muted">#${a.id} · ${dt(a.created_at)}</span>
        <button class="btn sm" onclick="copyText(state.addresses[${a.id}].noi_dung)">📋 Chép</button>
        <button class="btn sm" onclick="addressForm(${a.id})">✏️ Sửa</button></div>
    </div>`).join("") || `<div class="empty">${state.addrQ ? "Không có địa chỉ nào khớp" : "Chưa lưu địa chỉ nào – bấm ＋ Thêm địa chỉ"}</div>`;
}
function addressForm(id) {
  const a = id ? state.addresses[id] : {};
  openModal(`${modalHead(id ? `✏️ Địa chỉ #${id}` : "＋ Thêm địa chỉ")}
    <div class="form addr-form">${field(["noi_dung", "Địa chỉ", "textarea", a.noi_dung || "", {full: true, ph: "Tên người nhận, SĐT, địa chỉ… (xuống dòng thoải mái)"}])}</div>
    <div class="foot">${id ? `<button class="btn bad left" onclick="removeRec('addresses',${id})">🗑 Xóa</button>` : ""}
      <button class="btn" onclick="closeModal()">Hủy</button><button class="btn primary" onclick="saveAddress(${id || 0})">Lưu</button></div>`);
}
async function saveAddress(id) {
  const b = formData();
  if (!b.noi_dung.trim()) { toast("Địa chỉ trống", true); return; }
  if (id) await patch(`/addresses/${id}`, b); else await post("/addresses", b);
  toast("✏️ Đã lưu"); closeModal(); loadAddresses();
}
// chép chữ: clipboard API cần https / localhost → web chạy http trong mạng LAN thì dùng cách cũ (execCommand)
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select();
    const ok = document.execCommand("copy"); t.remove();
    if (!ok) { toast("Không chép được – hãy bôi đen để chép", true); return; }
  }
  toast("📋 Đã chép");
}

// ---------- tài khoản web (admin) ----------
async function viewUsers() {
  const list = await api("/users");
  state.users = Object.fromEntries(list.map(u => [u.id, u]));
  $("#view").innerHTML = `
    <div class="toolbar"><span class="meta">${list.length} tài khoản · admin được quản lí tài khoản, user dùng mọi chức năng còn lại</span></div>
    <div class="card"><table style="min-width:520px">
      <tr><th>Tên đăng nhập</th><th>Vai trò</th><th>Trạng thái</th><th>Đăng nhập gần nhất</th><th>Tạo lúc</th></tr>
      ${list.map(u => `<tr class="click" onclick="userForm(${u.id})">
        <td><b>${esc(u.username)}</b>${u.id === state.me.id ? ' <span class="badge b-muted">bạn</span>' : ""}</td>
        <td><span class="badge ${u.role === "admin" ? "b-accent" : "b-muted"}">${u.role}</span></td>
        <td>${u.active ? '<span class="badge b-done">● hoạt động</span>' : '<span class="badge b-cancel">🔒 khóa</span>'}</td>
        <td class="muted">${u.last_login ? dtFull(u.last_login) : "chưa"}</td>
        <td class="muted">${dtFull(u.created_at)}</td></tr>`).join("")}
    </table></div>
    <button class="btn primary fab" onclick="userForm()">＋ Thêm tài khoản</button>`;
}
function userForm(id) {
  const u = id ? state.users[id] : null, self = id === state.me.id;
  const roles = ["user", "admin"];
  openModal(`${modalHead(u ? `🔐 ${esc(u.username)}` : "＋ Thêm tài khoản")}
    <div class="form">
      ${u ? "" : field(["username", "Tên đăng nhập", "text", "", {ph: "3–32 ký tự: chữ, số, . _ - @"}])}
      ${self ? "" : field(["role", "Vai trò", "select", u ? u.role : "user", {options: roles}])}
      ${field(["password", u ? "Đặt lại mật khẩu (để trống = giữ nguyên)" : "Mật khẩu (≥ 6 ký tự)", "password", "", {full: !!u}])}
    </div>
    ${self ? '<div class="meta" style="margin-top:8px">Tài khoản của bạn: đổi mật khẩu ở nút 👤 góc trên.</div>' : ""}
    <div class="foot">
      ${u && !self ? `<button class="btn bad left" onclick="deleteUser(${id})">🗑 Xóa</button>
        <button class="btn" onclick="toggleUser(${id}, ${!u.active})">${u.active ? "🔒 Khóa" : "🔓 Mở khóa"}</button>` : ""}
      <button class="btn" onclick="closeModal()">Hủy</button>
      ${self ? "" : `<button class="btn primary" onclick="saveUser(${id || 0})">${u ? "Lưu" : "Tạo"}</button>`}
    </div>`);
}
async function saveUser(id) {
  const f = formData();
  if (id) {
    const body = {};
    if (f.role !== state.users[id].role) body.role = f.role;
    if (f.password) body.password = f.password;
    if (Object.keys(body).length) await patch(`/users/${id}`, body);
  } else await post("/users", f);
  toast(id ? "✏️ Đã lưu" : "➕ Đã tạo tài khoản"); closeModal(); viewUsers();
}
async function toggleUser(id, active) {
  await patch(`/users/${id}`, {active});
  toast(active ? "🔓 Đã mở khóa" : "🔒 Đã khóa – tài khoản bị đăng xuất"); closeModal(); viewUsers();
}
async function deleteUser(id) {
  if (!confirm(`Xóa tài khoản “${state.users[id].username}”?`)) return;
  await del(`/users/${id}`); toast("🗑 Đã xóa"); closeModal(); viewUsers();
}

start();
</script>
